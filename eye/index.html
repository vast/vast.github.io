<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eyexercise">
  <meta name="theme-color" content="#f7f7f7">
  <title>Eyexercise</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    .eyeworkout {
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
      color: #222;
      font-family: Monaco, Menlo, Consolas, monospace;
      font-size: clamp(1.5rem, -0.875rem + 8.333vw, 3.5rem);
      line-height: 1.2;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    .eyeworkout > * {
      max-width: 18em;
      padding: 1em;
    }
  </style>
</head>
<body>
  <main class="eyeworkout">
    <div>Нажмите где угодно, чтобы начать</div>
  </main>
  <audio id="alert" preload="auto">
    <source src="./assets/alert.mp3">
  </audio>

  <script>
    const steps = [
      { text: 'Нажмите где угодно, чтобы начать' },
      { text: 'Моргайте быстро-быстро', duration: 30 },
      { text: 'Крепко зажмурьтесь на пару секунд, а потом откройте глаза на пару секунд', duration: 30 },
      { text: 'Легко нажмите на верхнее веко тремя пальцами на пару секунд, потом отпустите на пару секунд', duration: 45 },
      { text: 'Медленно переводите взгляд вверх-вниз и влево-вправо, не меняя положения головы', duration: 30 },
      { text: 'Медленно переводите взгляд по диагоналям, не меняя положения головы', duration: 30 },
      { text: 'Вращайте глазные яблоки, один оборот – по часовой стрелке, другой – против', duration: 30 },
      { text: 'Сфокусируйте взгляд на отдаленном предмете, потом медленно сфокусируйте на близком предмете', duration: 60 },
      { text: 'Вы молодец!', duration: 5 }
    ]

    const main = document.querySelector('.eyeworkout')
    const alertSound = document.getElementById('alert')
    let currentStep = 0
    let nextStepTimeout = null
    let wakeLock = null

    function showStep(index) {
      currentStep = index % steps.length
      const { text, duration } = steps[currentStep]

      main.firstElementChild.textContent = text
      nextStepTimeout = duration ? setTimeout(() => showStep(currentStep + 1), duration * 1000) : null

      if (nextStepTimeout) {
        playAlert()
        keepScreenOn()
      } else {
        letScreenSleep()
      }
    }

    // Первый play() случается прямо в обработчике нажатия, это разрешает звук на iOS
    function playAlert() {
      alertSound.currentTime = 0
      alertSound.play().catch(() => {})
    }

    async function keepScreenOn() {
      if (wakeLock || !('wakeLock' in navigator)) return

      try {
        wakeLock = await navigator.wakeLock.request('screen')
        wakeLock.addEventListener('release', () => { wakeLock = null })
      } catch (e) {}
    }

    function letScreenSleep() {
      if (wakeLock) wakeLock.release()
    }

    main.addEventListener('click', () => {
      if (!nextStepTimeout) showStep(currentStep + 1)
    })

    // Браузер отпускает блокировку экрана, когда вкладка скрыта
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && nextStepTimeout) keepScreenOn()
    })

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js')
  </script>
</body>
</html>
