{%- assign m = include.date | date: "%-m" | minus: 1 -%}
{%- assign months = "января,февраля,марта,апреля,мая,июня,июля,августа,сентября,октября,ноября,декабря" | split: "," -%}
<time datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: "%-d" }} {{ months[m] }} {{ include.date | date: "%Y" }}</time>
